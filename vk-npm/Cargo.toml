[package]
name = "vk-npm"
version = "0.1.0"
edition = "2021"

[dependencies]
vk-ir = { path = "../vk-ir" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "json"], default-features = false }
