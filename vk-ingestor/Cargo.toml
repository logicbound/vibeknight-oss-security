[package]
name = "vk-ingestor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vk-ingestor"
path = "src/main.rs"

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest    = { version = "0.11", features = ["blocking", "rustls-tls", "json"], default-features = false }
redis      = { version = "0.25", default-features = false }
