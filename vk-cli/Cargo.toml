[package]
name = "vk-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vk"
path = "src/main.rs"

[dependencies]
clap      = { version = "4.5", features = ["derive", "env"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis     = { version = "0.25", default-features = false }
vk-core = { path = "../vk-core" }
vk-npm  = { path = "../vk-npm" }
