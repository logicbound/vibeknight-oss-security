[package]
name = "vk-downloader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vk-downloader"
path = "src/main.rs"

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest    = { version = "0.11", features = ["blocking", "rustls-tls"], default-features = false }
sha2       = "0.10"
hex        = "0.4"
flate2     = "1.0"
tar        = "0.4"
redis      = { version = "0.25", default-features = false }
