services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestor:
    build:
      context: .
      dockerfile: vk-ingestor/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/
    volumes:
      - ingestor-state:/data
    depends_on:
      redis:
        condition: service_healthy

  downloader:
    build:
      context: .
      dockerfile: vk-downloader/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/
    volumes:
      - artifacts:/artifacts
    depends_on:
      redis:
        condition: service_healthy

  analyzer:
    build:
      context: .
      dockerfile: vk-cli/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/
    volumes:
      - artifacts:/artifacts:ro
      - findings:/vk-output
    depends_on:
      redis:
        condition: service_healthy
      downloader:
        condition: service_started

volumes:
  redis-data:
  ingestor-state:
  artifacts:
  findings:
